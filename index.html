<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Sidrak Assistência Técnica | Cloud</title>
    <meta name="description" content="Ferramenta PWA profissional para técnicos de refrigeração.">
    <meta name="theme-color" content="#0f172a">

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- FAVICON -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">

    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-font-smoothing: antialiased; user-select: none; }
        input, textarea, .select-all { user-select: text; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: max(1.25rem, env(safe-area-inset-top)); }
        input, select, textarea { font-size: 16px !important; }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .accordion-content { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease; }
        .accordion-open .accordion-content { max-height: 1000px !important; opacity: 1 !important; }
        .accordion-icon { transition: transform 0.3s ease; }
        .accordion-open .accordion-icon { transform: rotate(180deg); }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); }
        #login-screen { position: fixed; inset: 0; background-color: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3498db; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print { #login-screen { display: none !important; } .no-print { display: none !important; } #printable-area { display: block !important; } }
    </style>
</head>
<body class="text-slate-800 pb-safe">

    <!-- TELA DE LOGIN (NUVEM) -->
    <div id="login-screen">
        <div class="w-full max-w-sm px-6">
            <div class="mb-8 text-center">
                <div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center text-4xl mb-4 mx-auto shadow-lg shadow-blue-500/30">❄️</div>
                <h1 class="text-white text-2xl font-black uppercase tracking-widest">Sidrak</h1>
                <p class="text-blue-400 text-sm font-bold uppercase tracking-widest">Acesso Nuvem ☁️</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-2xl">
                <h2 class="text-white text-lg font-bold mb-4">Entrar</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-200 text-xs font-bold uppercase mb-1">E-mail</label>
                        <input type="email" id="loginEmail" class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl p-3 focus:outline-none focus:border-blue-500" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-blue-200 text-xs font-bold uppercase mb-1">Senha</label>
                        <input type="password" id="loginPass" class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl p-3 focus:outline-none focus:border-blue-500" placeholder="******">
                    </div>
                    <button onclick="loginCloud()" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95 mt-2">
                        ENTRAR
                    </button>
                </div>
                <div class="mt-6 text-center border-t border-white/10 pt-4">
                    <button onclick="toggleAuth('register')" class="text-blue-400 text-xs font-bold hover:text-white uppercase">CRIAR CONTA</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="hidden bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-2xl">
                <h2 class="text-white text-lg font-bold mb-4">Novo Usuário</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-200 text-xs font-bold uppercase mb-1">E-mail</label>
                        <input type="email" id="regEmail" class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl p-3 focus:outline-none focus:border-green-500" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label class="block text-blue-200 text-xs font-bold uppercase mb-1">Senha (Mín 6 dígitos)</label>
                        <input type="password" id="regPass" class="w-full bg-slate-900/50 border border-slate-600 text-white rounded-xl p-3 focus:outline-none focus:border-green-500" placeholder="******">
                    </div>
                    <button onclick="registerCloud()" id="btnReg" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95 mt-2">
                        CADASTRAR
                    </button>
                </div>
                <div class="mt-6 text-center border-t border-white/10 pt-4">
                    <button onclick="toggleAuth('login')" class="text-slate-400 text-xs font-bold hover:text-white uppercase"><i class="fa-solid fa-arrow-left"></i> VOLTAR</button>
                </div>
            </div>
            
            <p id="authMsg" class="text-center text-red-400 text-xs font-bold mt-4 h-4"></p>
        </div>
    </div>

    <!-- APP WRAPPER (Principal) -->
    <div id="app-wrapper" class="hidden min-h-[100dvh] flex flex-col items-center justify-start sm:justify-center p-0 sm:p-4 no-print">
        <div class="w-full max-w-md bg-white sm:rounded-3xl overflow-hidden border-0 sm:border border-slate-200 shadow-none sm:shadow-2xl relative z-10 flex flex-col min-h-[100dvh] sm:min-h-0">
            
            <!-- HEADER -->
            <header class="bg-[#0f172a] text-white p-5 pt-safe pb-10 relative overflow-hidden flex justify-between items-center shadow-lg z-20">
                <div class="z-10 flex items-center gap-3">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-green-400 flex items-center gap-1"><i class="fa-solid fa-wifi text-[8px]"></i> ONLINE</span>
                        <h1 class="text-lg font-black uppercase tracking-wide text-white leading-none mt-0.5">Sidrak <span class="text-blue-500">App</span></h1>
                        <p id="userDisplay" class="text-[10px] text-slate-400 truncate w-32">...</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="logoutCloud()" class="z-10 text-white bg-red-500/20 w-9 h-9 flex items-center justify-center rounded-xl"><i class="fa-solid fa-right-from-bracket text-red-400 text-sm"></i></button>
                </div>
            </header>

            <!-- CONTEUDO -->
            <div class="relative -mt-6 bg-white rounded-t-[1.5rem] flex-grow shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.1)] z-30 overflow-y-auto pb-20">
                <div class="p-5 pt-6">
                    <div id="input-section" class="space-y-5">
                        
                        <!-- CAMPOS -->
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                            <label class="block text-xs font-bold text-blue-600 uppercase mb-2">Dados do Orçamento</label>
                            <input type="text" id="nomePrestador" placeholder="Sua Empresa" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                            <input type="text" id="nomeCliente" placeholder="Nome do Cliente" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                            <input type="text" id="enderecoCliente" placeholder="Endereço" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                            <input type="tel" id="telefoneCliente" placeholder="Telefone" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <input type="date" id="dataServico" class="input-field w-full p-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-center outline-none">
                                <input type="time" id="horaServico" value="09:00" class="input-field w-full p-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-center outline-none">
                            </div>
                            <textarea id="detalhesServico" placeholder="Observações..." class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-medium outline-none h-20"></textarea>
                        </div>

                        <!-- SERVIÇOS -->
                        <div class="space-y-3">
                            <div class="flex justify-between items-center px-1">
                                <label class="text-xs font-bold text-slate-500 uppercase">Serviços</label>
                            </div>
                            <div id="services-container" class="space-y-3"></div>
                            <button onclick="adicionarServico()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-xs font-bold text-slate-500 hover:border-blue-500 transition-colors">ADICIONAR ITEM</button>
                        </div>

                        <!-- CUSTOS -->
                        <div class="pt-4 border-t border-slate-100">
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Custos Extras</label>
                            <input type="number" id="custoPecas" placeholder="Material (R$)" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold mb-2">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="distanciaKm" placeholder="Km" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold">
                                <input type="number" id="inputGarantia" placeholder="Garantia (Dias)" class="input-field w-full p-3 bg-white border border-slate-200 rounded-xl text-sm font-bold" value="90">
                            </div>
                        </div>

                        <!-- TOTAL -->
                        <div class="bg-[#0f172a] p-6 rounded-3xl shadow-xl text-white text-center mt-4">
                            <p class="text-[10px] font-bold text-blue-300 uppercase mb-2">Total Estimado</p>
                            <p class="text-4xl font-black mb-4" id="displayPrecoFinal">R$ 0,00</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="calcularPrecos()" class="bg-blue-600 py-3 rounded-xl text-xs font-bold shadow-lg active:scale-95 transition-transform">CALCULAR</button>
                                <button onclick="compartilharPDF()" class="bg-white text-slate-800 py-3 rounded-xl text-xs font-bold shadow-lg active:scale-95 transition-transform">GERAR PDF</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ÁREA DE IMPRESSÃO (PDF) -->
    <div id="printable-area" class="hidden">
        <div style="font-family: 'Inter', sans-serif; color: #334155; max-width: 800px; margin: 0 auto; padding: 40px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; margin-bottom: 30px;">
                <div>
                    <h1 style="font-size: 22px; font-weight: 800; color: #0f172a; margin: 0; line-height: 1.2;" id="printPrestador">Prestador</h1>
                    <p style="font-size: 14px; color: #64748b; margin: 5px 0 0 0;">Orçamento Profissional</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Data</div>
                    <div style="font-size: 16px; font-weight: 600; color: #0f172a;" id="printData">--/--/----</div>
                </div>
            </div>
            <div style="background-color: #f8fafc; padding: 25px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e2e8f0;">
                <p style="font-size: 16px; font-weight: 700; color: #0f172a; margin: 0;" id="printCliente">Nome do Cliente</p>
                <p style="font-size: 14px; color: #64748b; margin: 4px 0 0 0;" id="printTelefone">--</p>
                <p style="font-size: 14px; color: #64748b; margin: 2px 0 0 0;" id="printEndereco">--</p>
                <p style="font-size: 13px; color: #475569; margin: 10px 0 0 0; font-style: italic;" id="printDetalhes">...</p>
            </div>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                <thead>
                    <tr style="border-bottom: 2px solid #0f172a;">
                        <th style="text-align: left; padding: 10px 0;">Serviço</th>
                        <th style="text-align: center; padding: 10px 0;">Qtd</th>
                        <th style="text-align: right; padding: 10px 0;">Valor</th>
                    </tr>
                </thead>
                <tbody id="printServicesList" style="font-size: 14px;"></tbody>
            </table>
            <div style="text-align: right;">
                <p style="font-size: 14px; color: #64748b;">Materiais: <span id="printMateriais" style="font-weight: 600;">R$ 0,00</span></p>
                <p style="font-size: 22px; font-weight: 900; color: #0f172a; margin-top: 10px;" id="printTotal">R$ 0,00</p>
            </div>
            <div style="margin-top: 40px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px dashed #cbd5e1; padding-top: 20px;">
                <p>Garantia de <span id="printGarantia" style="font-weight: 700;">90 dias</span>.</p>
                <p>Gerado via Sidrak Assistência Técnica</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBfG-3SV8Tkczas4cGcIQwv5atFZVcDKFs",
            authDomain: "tutor-estudos.firebaseapp.com",
            projectId: "tutor-estudos",
            storageBucket: "tutor-estudos.appspot.com",
            messagingSenderId: "691817799067",
            appId: "1:691817799067:web:090572d64ffc44aa5dd53e"
        };

        // LISTA DE SERVIÇOS COMPLETA
        const HVAC_SERVICES = [
            { nome: "Instalação Split 9000/12000 BTUs", min: 500 },
            { nome: "Instalação Split 18000/24000 BTUs", min: 750 },
            { nome: "Instalação Piso Teto / Cassete", min: 1200 },
            { nome: "Instalação Multi-Split (Por Evaporadora)", min: 450 },
            { nome: "Desinstalação de Equipamento", min: 250 },
            { nome: "Limpeza e Higienização (Simples)", min: 200 },
            { nome: "Limpeza Química (Desmontagem Completa)", min: 350 },
            { nome: "PMOC (Manutenção Mensal)", min: 80 },
            { nome: "Carga de Gás (R410A/R22/R32)", min: 280 },
            { nome: "Troca de Capacitor / Relé", min: 180 },
            { nome: "Troca de Compressor (Mão de Obra)", min: 450 },
            { nome: "Correção de Vazamento (Flange/Solda)", min: 250 },
            { nome: "Teste de Estanqueidade (Nitrogênio)", min: 150 },
            { nome: "Vácuo no Sistema", min: 150 },
            { nome: "Visita Técnica / Diagnóstico", min: 120 },
            { nome: "Infraestrutura (Metro Linear)", min: 100 },
            { nome: "Instalação de Bomba de Dreno", min: 180 },
            { nome: "Troca de Placa Eletrônica", min: 200 },
            { nome: "Higienização de Dutos", min: 400 },
            { nome: "Reparo em Comando Elétrico", min: 250 }
        ];

        const DATA_VEICULOS = { utilitario: { eficiencia: 10.5, custoKm: 0.88 }, hatch: { eficiencia: 11.0, custoKm: 0.45 }, moto: { eficiencia: 35.0, custoKm: 0.20 } };
        let state = { veiculo: 'hatch', gasolina: 6.15 };

        // Inicializa Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            auth.onAuthStateChanged((user) => {
                const loginScreen = document.getElementById('login-screen');
                const appWrapper = document.getElementById('app-wrapper');
                
                if (user) {
                    document.getElementById('userDisplay').innerText = user.email;
                    loginScreen.style.display = 'none';
                    appWrapper.classList.remove('hidden');
                    carregarDadosNuvem(user.uid);
                } else {
                    loginScreen.style.display = 'flex';
                    appWrapper.classList.add('hidden');
                }
            });

        } catch(e) {
            console.error("Erro Firebase:", e);
            document.getElementById('authMsg').innerText = "Erro ao conectar.";
        }

        // --- FUNÇÕES DE LOGIN/CADASTRO ---
        function toggleAuth(mode) {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('authMsg').innerText = "";
        }

        function loginCloud() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('authMsg');

            btn.disabled = true; btn.innerText = "...";
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .catch((error) => {
                    btn.disabled = false; btn.innerText = "ENTRAR";
                    msg.innerText = "Erro: " + error.message;
                });
        }

        function registerCloud() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const btn = document.getElementById('btnReg');
            const msg = document.getElementById('authMsg');

            if(pass.length < 6) { msg.innerText = "Senha deve ter 6+ dígitos."; return; }

            btn.disabled = true; btn.innerText = "...";
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(() => { alert("Conta criada!"); toggleAuth('login'); })
                .catch((error) => {
                    btn.disabled = false; btn.innerText = "CADASTRAR";
                    msg.innerText = "Erro: " + error.message;
                });
        }

        function logoutCloud() { firebase.auth().signOut(); }

        // --- SALVAR DADOS NA NUVEM ---
        let saveTimeout;
        function saveAutoSave() {
            const user = firebase.auth().currentUser;
            if(!user) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const dados = {
                    prestador: document.getElementById('nomePrestador').value,
                    cliente: document.getElementById('nomeCliente').value,
                    endereco: document.getElementById('enderecoCliente').value,
                    telefone: document.getElementById('telefoneCliente').value,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                firebase.firestore().collection('usuarios').doc(user.uid).set(dados, { merge: true });
            }, 1000);
        }

        function carregarDadosNuvem(uid) {
            firebase.firestore().collection('usuarios').doc(uid).get().then((doc) => {
                if (doc.exists) {
                    const d = doc.data();
                    if(d.prestador) document.getElementById('nomePrestador').value = d.prestador;
                    if(d.cliente) document.getElementById('nomeCliente').value = d.cliente;
                    if(d.endereco) document.getElementById('enderecoCliente').value = d.endereco;
                    if(d.telefone) document.getElementById('telefoneCliente').value = d.telefone;
                }
            });
        }

        // --- LÓGICA DO APP ---
        window.onload = () => {
            document.getElementById('dataServico').valueAsDate = new Date();
            adicionarServico();
            document.querySelectorAll('input, textarea').forEach(i => i.addEventListener('input', saveAutoSave));
        };

        function adicionarServico() {
            const container = document.getElementById('services-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 mb-2 animate-slide-up";
            let opts = `<option value="" disabled selected>Selecione...</option>`;
            HVAC_SERVICES.forEach(s => opts += `<option value="${s.min}">${s.nome}</option>`);
            
            div.innerHTML = `
                <select class="w-full p-2 bg-slate-50 border rounded-lg text-xs outline-none" onchange="this.nextElementSibling.value=this.value; calcularPrecos()">${opts}</select>
                <input type="number" class="w-20 p-2 bg-slate-50 border rounded-lg text-xs font-bold text-center service-price outline-none" placeholder="0" oninput="calcularPrecos()">
                <button onclick="this.parentElement.remove(); calcularPrecos()" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function calcularPrecos() {
            let total = 0;
            document.querySelectorAll('.service-price').forEach(el => total += Number(el.value));
            const mat = Number(document.getElementById('custoPecas').value) || 0;
            const km = Number(document.getElementById('distanciaKm').value) || 0;
            
            // Custo Logística Simplificado
            const logistica = km * 1.50; // R$ 1,50 por km (média)
            
            const final = total + mat + logistica;
            document.getElementById('displayPrecoFinal').innerText = final.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            return { total, mat, logistica, final };
        }

        async function compartilharPDF() {
            const res = calcularPrecos();
            const prestador = document.getElementById('nomePrestador').value || "Técnico";
            const cliente = document.getElementById('nomeCliente').value || "Cliente";
            const data = document.getElementById('dataServico').value;
            const garantia = document.getElementById('inputGarantia').value || 90;

            document.getElementById('printPrestador').innerText = prestador;
            document.getElementById('printCliente').innerText = cliente;
            document.getElementById('printTelefone').innerText = document.getElementById('telefoneCliente').value;
            document.getElementById('printEndereco').innerText = document.getElementById('enderecoCliente').value;
            document.getElementById('printDetalhes').innerText = document.getElementById('detalhesServico').value;
            document.getElementById('printData').innerText = data.split('-').reverse().join('/');
            document.getElementById('printMateriais').innerText = res.mat.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('printTotal').innerText = res.final.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('printGarantia').innerText = garantia + " dias";

            const tbody = document.getElementById('printServicesList');
            tbody.innerHTML = '';
            document.querySelectorAll('#services-container > div').forEach(div => {
                const sel = div.querySelector('select');
                const val = div.querySelector('input');
                if (sel.selectedIndex > 0) {
                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding: 8px 0;">${sel.options[sel.selectedIndex].text}</td>
                            <td style="padding: 8px 0; text-align: center;">1</td>
                            <td style="padding: 8px 0; text-align: right;">R$ ${Number(val.value).toFixed(2)}</td>
                        </tr>
                    `;
                }
            });

            const element = document.getElementById('printable-area');
            element.classList.remove('hidden');
            const opt = { margin: 5, filename: `Orcamento_${cliente}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            
            try {
                await html2pdf().set(opt).from(element).save();
            } catch(e) {
                console.error(e);
                window.print();
            } finally {
                element.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
